<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .user, .ai {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .user {
            background: #e0e7ff;
        }

        .ai {
            background: #dcfce7;
        }

        input {
            width: calc(100% - 110px);
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 90px;
            padding: 12px;
            margin-left: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <h1>NEXORA AI</h1>
        <p>Asistente inteligente para empresas</p>
    </header>

    <div class="container">

        <h2>Asistente empresarial</h2>

        <div id="chat">
            <div class="ai">
                <strong>NEXORA AI:</strong>
                Hola. Soy NEXORA AI. Puedo ayudarte con productos, precios y stock.
            </div>
        </div>

        <input
            id="userInput"
            type="text"
            placeholder="Escribe tu pregunta..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button onclick="sendMessage()">Enviar</button>

    </div>

    <script>

        // INFORMACIÓN DE LOS PRODUCTOS

        const productos = [

            {
                nombre: "Portátil NEXORA Pro",
                precio: 899,
                stock: 12
            },

            {
                nombre: "NEXORA Phone X",
                precio: 699,
                stock: 25
            },

            {
                nombre: "Auriculares NEXORA Buds",
                precio: 149,
                stock: 40
            }

        ];


        // FUNCIÓN DEL CHAT

        function sendMessage() {

            const input = document.getElementById("userInput");
            const chat = document.getElementById("chat");

            const pregunta = input.value.trim();
            const mensaje = pregunta.toLowerCase();

            if (pregunta === "") {
                return;
            }


            // Mostrar mensaje del usuario

            chat.innerHTML += `
                <div class="user">
                    <strong>Tú:</strong> ${pregunta}
                </div>
            `;


            let respuesta = "";


           // PRODUCTOS

if (
    mensaje.includes("producto") ||
    mensaje.includes("productos")
) {

    respuesta =
        "¡Claro! Estos son nuestros productos:<br><br>";

    productos.forEach(producto => {

        respuesta += `
            <strong>${producto.nombre}</strong><br>
            Precio: ${producto.precio}€<br>
            Stock: ${producto.stock} unidades<br><br>
        `;

    });

}


// SALUDO

else if (mensaje.includes("hola")) {

    respuesta =
        "¡Hola! Soy NEXORA AI. ¿En qué puedo ayudarte?";

}

                respuesta =
                    "Estos son nuestros productos:<br><br>";

                productos.forEach(producto => {

                    respuesta += `
                        <strong>${producto.nombre}</strong><br>
                        Precio: ${producto.precio}€<br>
                        Stock: ${producto.stock} unidades<br><br>
                    `;

                });

            }


            // CONSULTAR STOCK

            else if (mensaje.includes("stock")) {

                let productoEncontrado = productos.find(producto =>
                    mensaje.includes(producto.nombre.toLowerCase())
                );


                if (productoEncontrado) {

                    respuesta =
                        `El stock de <strong>${productoEncontrado.nombre}</strong>
                        es de <strong>${productoEncontrado.stock} unidades</strong>.`;

                } else {

                    respuesta =
                        "Actualmente tenemos:<br><br>";

                    productos.forEach(producto => {

                        respuesta +=
                            `<strong>${producto.nombre}</strong>:
                            ${producto.stock} unidades<br>`;

                    });

                }

            }


            // CONSULTAR PRECIO

            else if (mensaje.includes("precio")) {

                let productoEncontrado = productos.find(producto =>
                    mensaje.includes(producto.nombre.toLowerCase())
                );


                if (productoEncontrado) {

                    respuesta =
                        `El precio del <strong>${productoEncontrado.nombre}</strong>
                        es de <strong>${productoEncontrado.precio}€</strong>.`;

                } else {

                    respuesta =
                        "Actualmente tenemos estos precios:<br><br>";

                    productos.forEach(producto => {

                        respuesta +=
                            `<strong>${producto.nombre}</strong>:
                            ${producto.precio}€<br>`;

                    });

                }

            }


            // PREGUNTAS SOBRE NEXORA

            else if (mensaje.includes("nexora")) {

                respuesta =
                    "NEXORA es una empresa tecnológica ficticia especializada en productos electrónicos.";

            }


            // RESPUESTA POR DEFECTO

            else {

                respuesta =
                    "Todavía no conozco la respuesta a esa pregunta. Prueba preguntando por productos, precios o stock.";

            }


            // Mostrar respuesta

            chat.innerHTML += `
                <div class="ai">
                    <strong>NEXORA AI:</strong> ${respuesta}
                </div>
            `;


            // Limpiar el cuadro

            input.value = "";

            // Bajar al último mensaje

            chat.scrollTop = chat.scrollHeight;

        }

    </script>

</body>

</html>
